---
# Desktop environment to install.
# Options: openbox (default), elementary
desktop_type: openbox

# User that owns the desktop and VNC session.
vnc_user: "{{ 'ubuntu' if ansible_distribution == 'Ubuntu' else 'root' }}"

# VNC display number and screen settings.
vnc_display: 1
vnc_geometry: '1280x720'
vnc_depth: 24

# Number of virtual desktops (openbox only).
openbox_desktops: 1

# Set to true during smoke tests to paint a bright-green xterm on screen.
smoke_test_marker_enabled: false

# Token lifetime in seconds. Default: 8 hours.
auth_token_ttl_seconds: 28800

# Base URL used when building the access URL returned by novnc-desktop-url.
# Should match the public HTTPS address of this host.
novnc_base_url: 'https://{{ inventory_hostname }}'

# Port the auth service listens on (localhost only).
auth_service_port: 8898

# When true, the role will attempt to obtain a Let's Encrypt certificate if
# tls_domain resolves to a public IP and letsencrypt_email is set.
use_certbot: false

# Domain for the TLS certificate. Defaults to the inventory hostname.
tls_domain: '{{ inventory_hostname }}'

# Email for Let's Encrypt registration. Falls back to self-signed if unset.
letsencrypt_email: ''
