---
- name: Install TigerVNC
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name:
      - tigervnc-standalone-server
      - tigervnc-common
    state: present

- name: Set VNC home directory
  ansible.builtin.set_fact:
    vnc_home: "{{ '/root' if vnc_user == 'root' else '/home/' + vnc_user }}"

- name: Create .vnc directory
  ansible.builtin.file:
    path: '{{ vnc_home }}/.vnc'
    state: directory
    owner: '{{ vnc_user }}'
    group: '{{ vnc_user }}'
    mode: '0700'

- name: Configure TigerVNC server users
  ansible.builtin.lineinfile:
    path: /etc/tigervnc/vncserver.users
    regexp: '^:{{ vnc_display }}='
    line: ':{{ vnc_display }}={{ vnc_user }}'
    create: true
    mode: '0644'

- name: Configure TigerVNC options
  ansible.builtin.copy:
    dest: '{{ vnc_home }}/.vnc/config'
    owner: '{{ vnc_user }}'
    group: '{{ vnc_user }}'
    mode: '0644'
    content: |
      geometry={{ vnc_geometry }}
      depth={{ vnc_depth }}
      SecurityTypes=None
      IdleTimeout={{ vnc_idle_timeout }}
  notify: Reload systemd

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Enable and start VNC server
  ansible.builtin.systemd:
    name: 'tigervncserver@:{{ vnc_display }}.service'
    enabled: true
    state: restarted
