---
# Desktop environment to install.
# Options: openbox (default), elementary
desktop_type: openbox

# User that owns the desktop session.
vnc_user: "{{ 'ubuntu' if ansible_distribution == 'Ubuntu' else 'root' }}"

# Display resolution.
vnc_geometry: '1280x720'
vnc_depth: 24

# Number of virtual desktops (openbox only).
openbox_desktops: 1

# Set to true during smoke tests to paint a bright-green xterm on screen
# so the Playwright canvas checker can verify the desktop is rendering.
smoke_test_marker_enabled: false
