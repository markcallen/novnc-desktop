---
# Deepin Desktop Environment (from Ubuntu universe repos)
# Available as deepin-desktop-environment on Ubuntu 24.04.

- name: Enable universe repository
  ansible.builtin.apt_repository:
    repo: 'deb http://archive.ubuntu.com/ubuntu {{ ansible_distribution_release }} universe'
    state: present
    update_cache: true

- name: Install Deepin desktop packages
  ansible.builtin.apt:
    name:
      - deepin-desktop-environment
    state: present
  register: deepin_install
  failed_when: false

- name: Warn if Deepin install failed (best-effort)
  ansible.builtin.debug:
    msg: >-
      WARNING: deepin-desktop-environment could not be installed.
      The package may not be available for this Ubuntu release in universe.
      Manual installation may be required.
  when: deepin_install.failed | bool

- name: Mask display manager to prevent it conflicting with VNC
  ansible.builtin.systemd:
    name: '{{ item }}'
    masked: true
    daemon_reload: false
  loop:
    - lightdm
    - gdm3
    - deepin-anything-server
  failed_when: false

- name: Set VNC home directory
  ansible.builtin.set_fact:
    desktop_vnc_home: "{{ '/root' if vnc_user == 'root' else '/home/' + vnc_user }}"

- name: Create .vnc directory
  ansible.builtin.file:
    path: '{{ desktop_vnc_home }}/.vnc'
    state: directory
    owner: '{{ vnc_user }}'
    group: '{{ vnc_user }}'
    mode: '0700'

- name: Deploy Deepin xstartup
  ansible.builtin.template:
    src: xstartup-deepin.j2
    dest: '{{ desktop_vnc_home }}/.vnc/xstartup'
    owner: '{{ vnc_user }}'
    group: '{{ vnc_user }}'
    mode: '0755'
