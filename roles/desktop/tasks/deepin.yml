---
# Deepin Desktop Environment — requires Ubuntu 22.04 (Jammy).
#
# startdde and dde-dconfig-daemon work correctly on Jammy. This role installs
# the full DDE via the UbuntuDDE PPA and launches it with startdde over VNC.

- name: Assert Ubuntu 22.04
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Ubuntu'
      - ansible_distribution_version is version('22.04', '==')
    fail_msg: >-
      Deepin requires Ubuntu 22.04 (Jammy). Detected
      {{ ansible_distribution }} {{ ansible_distribution_version }}.
      Provision the host with infra-up-ubuntu22.sh instead of infra-up.sh.

- name: Install software-properties-common for PPA support
  ansible.builtin.apt:
    name: software-properties-common
    state: present

- name: Add UbuntuDDE PPA
  ansible.builtin.apt_repository:
    repo: 'ppa:ubuntudde-dev/stable'
    state: present
    update_cache: true

- name: Install Deepin desktop environment
  ansible.builtin.apt:
    name:
      - dde
      - dde-kwin
    state: present

- name: Mask display managers and file indexer to prevent conflict with VNC
  ansible.builtin.systemd:
    name: '{{ item }}'
    masked: true
    daemon_reload: false
  loop:
    - lightdm
    - gdm3
    - deepin-anything-server
  failed_when: false

- name: Set VNC home directory
  ansible.builtin.set_fact:
    desktop_vnc_home: "{{ '/root' if vnc_user == 'root' else '/home/' + vnc_user }}"

- name: Create .vnc directory
  ansible.builtin.file:
    path: '{{ desktop_vnc_home }}/.vnc'
    state: directory
    owner: '{{ vnc_user }}'
    group: '{{ vnc_user }}'
    mode: '0700'

- name: Deploy Deepin xstartup
  ansible.builtin.template:
    src: xstartup-deepin.j2
    dest: '{{ desktop_vnc_home }}/.vnc/xstartup'
    owner: '{{ vnc_user }}'
    group: '{{ vnc_user }}'
    mode: '0755'
