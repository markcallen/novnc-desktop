---
# Install browser and desktop environment selected by desktop_type.

- name: Fail on unsupported desktop_type
  ansible.builtin.fail:
    msg: "desktop_type '{{ desktop_type }}' is not supported. Choose: openbox, elementary"
  when: desktop_type not in ['openbox', 'elementary']

- name: Fail on non-x86_64 host
  ansible.builtin.fail:
    msg: >-
      Google Chrome is only available for x86_64 hosts.
      This host is {{ ansible_facts['architecture'] }}.
  when: ansible_facts['architecture'] != "x86_64"

- name: Install base desktop packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name:
      - dbus-x11
      - xterm
      - fonts-liberation
      - ca-certificates
      - curl
      - gpg
    state: present

- name: Install Google Chrome signing key
  ansible.builtin.get_url:
    url: https://dl.google.com/linux/linux_signing_key.pub
    dest: /usr/share/keyrings/googlechrome.pub
    mode: '0644'
  become: true

- name: Configure Google Chrome apt repository
  ansible.builtin.apt_repository:
    repo: 'deb [arch=amd64 signed-by=/usr/share/keyrings/googlechrome.pub] https://dl.google.com/linux/chrome/deb/ stable main'
    filename: google-chrome
    state: present
    update_cache: true

- name: Install Google Chrome
  ansible.builtin.apt:
    name: google-chrome-stable
    state: present

- name: Set VNC home directory
  ansible.builtin.set_fact:
    desktop_vnc_home: "{{ '/root' if vnc_user == 'root' else '/home/' + vnc_user }}"

- name: Set Google Chrome as default browser
  community.general.alternatives:
    name: x-www-browser
    path: /usr/bin/google-chrome-stable

- name: Create user config directory
  ansible.builtin.file:
    path: '{{ desktop_vnc_home }}/.config'
    state: directory
    owner: '{{ vnc_user }}'
    group: '{{ vnc_user }}'
    mode: '0755'

- name: Set Google Chrome as default desktop browser
  ansible.builtin.template:
    src: mimeapps.list.j2
    dest: '{{ desktop_vnc_home }}/.config/mimeapps.list'
    owner: '{{ vnc_user }}'
    group: '{{ vnc_user }}'
    mode: '0644'

- name: Warn when VNC session is configured to run as root
  ansible.builtin.debug:
    msg: >-
      WARNING: vnc_user is set to root. Running the desktop session as root is
      discouraged. Prefer an existing non-root account such as ubuntu.
  when: vnc_user == "root"

- name: Include desktop-specific tasks
  ansible.builtin.include_tasks: '{{ desktop_type }}.yml'
