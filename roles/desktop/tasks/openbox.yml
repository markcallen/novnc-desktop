---
# Compatibility "openbox" variant: lightweight XFCE session optimized for noVNC.

- name: Install lightweight XFCE desktop packages
  ansible.builtin.apt:
    name:
      - xfce4
      - xfce4-goodies
      - xfce4-terminal
      - xfce4-clipman
      - xfce4-clipman-plugin
      - xfce4-pulseaudio-plugin
      - xclip
      - xsel
      - fonts-inter
      - fonts-noto
      - fonts-noto-color-emoji
      - adwaita-icon-theme-full
      - adwaita-icon-theme
      - hicolor-icon-theme
      - librsvg2-common
      - gtk-update-icon-cache
    state: present

- name: Mask display manager to prevent it conflicting with VNC
  ansible.builtin.systemd:
    name: '{{ item }}'
    masked: true
    daemon_reload: false
  loop:
    - lightdm
    - gdm3
  failed_when: false

- name: Update icon cache (hicolor)
  ansible.builtin.command: gtk-update-icon-cache -f /usr/share/icons/hicolor
  changed_when: false
  failed_when: false

- name: Update icon cache (Adwaita)
  ansible.builtin.command: gtk-update-icon-cache -f /usr/share/icons/Adwaita
  changed_when: false
  failed_when: false

- name: Set VNC home directory
  ansible.builtin.set_fact:
    desktop_vnc_home: "{{ '/root' if vnc_user == 'root' else '/home/' + vnc_user }}"

- name: Check Google Chrome executable
  ansible.builtin.stat:
    path: /usr/bin/google-chrome-stable
  register: desktop_chrome_executable

- name: Check Firefox executable paths
  ansible.builtin.stat:
    path: '{{ item }}'
  loop:
    - /usr/bin/firefox
    - /snap/bin/firefox
  register: desktop_firefox_executables

- name: Set managed XFCE panel launcher facts
  ansible.builtin.set_fact:
    desktop_chrome_launcher_enabled: '{{ desktop_chrome_executable.stat.exists }}'
    desktop_firefox_launcher_path: >-
      {{
        (
          desktop_firefox_executables.results
          | selectattr('stat.exists', 'equalto', true)
          | map(attribute='item')
          | list
          | first
        )
        | default('')
        | trim
      }}
    desktop_firefox_launcher_enabled: >-
      {{
        desktop_firefox_executables.results
        | selectattr('stat.exists', 'equalto', true)
        | list
        | length > 0
      }}

- name: Create XFCE config directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: '{{ vnc_user }}'
    group: '{{ vnc_user }}'
    mode: '0755'
  loop:
    - '{{ desktop_vnc_home }}/.config/autostart'
    - '{{ desktop_vnc_home }}/.config/xfce4'
    - '{{ desktop_vnc_home }}/.config/xfce4/xfconf'
    - '{{ desktop_vnc_home }}/.config/xfce4/xfconf/xfce-perchannel-xml'
    - '{{ desktop_vnc_home }}/.config/xfce4/panel'
    - '{{ desktop_vnc_home }}/.config/xfce4/terminal'

- name: Create managed XFCE panel launcher directories
  ansible.builtin.file:
    path: '{{ desktop_vnc_home }}/.config/xfce4/panel/launcher-{{ item.id }}'
    state: directory
    owner: '{{ vnc_user }}'
    group: '{{ vnc_user }}'
    mode: '0755'
  loop:
    - id: 2
      enabled: '{{ desktop_chrome_launcher_enabled }}'
    - id: 3
      enabled: '{{ desktop_firefox_launcher_enabled }}'
    - id: 4
      enabled: true
  when: item.enabled | bool

- name: Deploy managed XFCE panel configuration
  ansible.builtin.template:
    src: xfce4-panel.xml.j2
    dest: '{{ desktop_vnc_home }}/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml'
    owner: '{{ vnc_user }}'
    group: '{{ vnc_user }}'
    mode: '0644'

- name: Deploy Google Chrome panel launcher
  ansible.builtin.template:
    src: xfce-launcher-google-chrome.desktop.j2
    dest: '{{ desktop_vnc_home }}/.config/xfce4/panel/launcher-2/google-chrome.desktop'
    owner: '{{ vnc_user }}'
    group: '{{ vnc_user }}'
    mode: '0644'
  when: desktop_chrome_launcher_enabled | bool

- name: Deploy Firefox panel launcher
  ansible.builtin.template:
    src: xfce-launcher-firefox.desktop.j2
    dest: '{{ desktop_vnc_home }}/.config/xfce4/panel/launcher-3/firefox.desktop'
    owner: '{{ vnc_user }}'
    group: '{{ vnc_user }}'
    mode: '0644'
  when: desktop_firefox_launcher_enabled | bool

- name: Deploy XFCE Terminal panel launcher
  ansible.builtin.template:
    src: xfce-launcher-terminal.desktop.j2
    dest: '{{ desktop_vnc_home }}/.config/xfce4/panel/launcher-4/xfce4-terminal.desktop'
    owner: '{{ vnc_user }}'
    group: '{{ vnc_user }}'
    mode: '0644'

- name: Check XFCE Clipman autostart file
  ansible.builtin.stat:
    path: /etc/xdg/autostart/xfce4-clipman-plugin-autostart.desktop
  register: desktop_clipman_autostart

- name: Enable XFCE Clipman autostart
  ansible.builtin.copy:
    src: /etc/xdg/autostart/xfce4-clipman-plugin-autostart.desktop
    dest: '{{ desktop_vnc_home }}/.config/autostart/xfce4-clipman-plugin-autostart.desktop'
    owner: '{{ vnc_user }}'
    group: '{{ vnc_user }}'
    mode: '0644'
    remote_src: true
  when: desktop_clipman_autostart.stat.exists

- name: Configure XFCE terminal defaults
  ansible.builtin.copy:
    dest: '{{ desktop_vnc_home }}/.config/xfce4/terminal/terminalrc'
    owner: '{{ vnc_user }}'
    group: '{{ vnc_user }}'
    mode: '0644'
    content: |
      [Configuration]
      FontName=DejaVu Sans Mono 10
      MiscMenubarDefault=FALSE
      MiscToolbarDefault=FALSE
      MiscConfirmClose=FALSE

- name: Configure XFCE terminal clipboard shortcuts
  ansible.builtin.template:
    src: xfce-terminal-accels.scm.j2
    dest: '{{ desktop_vnc_home }}/.config/xfce4/terminal/accels.scm'
    owner: '{{ vnc_user }}'
    group: '{{ vnc_user }}'
    mode: '0644'

- name: Create .vnc directory
  ansible.builtin.file:
    path: '{{ desktop_vnc_home }}/.vnc'
    state: directory
    owner: '{{ vnc_user }}'
    group: '{{ vnc_user }}'
    mode: '0700'

- name: Deploy lightweight XFCE xstartup
  ansible.builtin.template:
    src: xstartup-openbox.j2
    dest: '{{ desktop_vnc_home }}/.vnc/xstartup'
    owner: '{{ vnc_user }}'
    group: '{{ vnc_user }}'
    mode: '0755'
