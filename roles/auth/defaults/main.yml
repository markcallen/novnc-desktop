---
# Token lifetime in seconds. Default: 8 hours.
auth_token_ttl_seconds: 28800

# Base URL used when building the access URL returned by novnc-desktop-url.
# Should match the public HTTPS address of this host. Includes the configured
# HTTPS port automatically when it is not the default 443.
novnc_https_port: 443
novnc_base_url: >-
  https://{{ inventory_hostname }}{{
    '' if (novnc_https_port | int) == 443 else ':' ~ (novnc_https_port | string)
  }}

# Port the auth service listens on (localhost only).
auth_service_port: 8898

# The OS user pre-registered in the user registry during provisioning.
# Set this to match the vnc_user configured in the vnc role.
# Display number and websockify port for that initial user must also match
# what the novnc role configures (display 1, websockify on 6080 + display).
auth_initial_user: ubuntu
auth_initial_display: 1
auth_initial_ws_port: 6081
