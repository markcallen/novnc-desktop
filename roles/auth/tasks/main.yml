---
- name: Create novnc-auth service user
  ansible.builtin.user:
    name: novnc-auth
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/novnc-auth
    create_home: true
    comment: 'noVNC token auth service'

- name: Create /etc/novnc-auth directory
  ansible.builtin.file:
    path: /etc/novnc-auth
    state: directory
    owner: novnc-auth
    group: novnc-auth
    mode: '0750'

- name: Generate HMAC secret (if not already present)
  ansible.builtin.shell: |
    set -euo pipefail
    python3 -c "import secrets; print(secrets.token_hex(32))" > /etc/novnc-auth/secret
    chmod 600 /etc/novnc-auth/secret
    chown novnc-auth:novnc-auth /etc/novnc-auth/secret
  args:
    creates: /etc/novnc-auth/secret
    executable: /bin/bash

- name: Write auth service config
  ansible.builtin.template:
    src: config.json.j2
    dest: /etc/novnc-auth/config.json
    owner: novnc-auth
    group: novnc-auth
    mode: '0640'
  notify: Restart novnc-auth

- name: Initialize user registry (skip if already present to preserve live registrations)
  ansible.builtin.template:
    src: users.json.j2
    dest: /etc/novnc-auth/users.json
    owner: novnc-auth
    group: novnc-auth
    mode: '0640'
    force: false

- name: Create auth service library directory
  ansible.builtin.file:
    path: /usr/local/lib/novnc-auth
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install novnc-auth Python service
  ansible.builtin.copy:
    src: novnc-auth.py
    dest: /usr/local/lib/novnc-auth/novnc-auth.py
    owner: root
    group: root
    mode: '0644'
  notify: Restart novnc-auth

- name: Install systemd unit for novnc-auth
  ansible.builtin.template:
    src: novnc-auth.service.j2
    dest: /etc/systemd/system/novnc-auth.service
    mode: '0644'
  notify:
    - Reload systemd
    - Restart novnc-auth

- name: Install novnc-desktop-url command
  ansible.builtin.copy:
    src: novnc-desktop-url
    dest: /usr/local/bin/novnc-desktop-url
    owner: root
    group: root
    mode: '0755'

- name: Install novnc-user-setup script
  ansible.builtin.copy:
    src: novnc-user-setup
    dest: /usr/local/bin/novnc-user-setup
    owner: root
    group: root
    mode: '0755'

- name: Install sudoers rule for novnc-user-setup
  ansible.builtin.copy:
    src: novnc-user-setup-sudoers
    dest: /etc/sudoers.d/novnc-user-setup
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s

- name: Install novnc-rotate-secret script
  ansible.builtin.copy:
    src: novnc-rotate-secret
    dest: /usr/local/bin/novnc-rotate-secret
    owner: root
    group: root
    mode: '0755'

- name: Install novnc-rotate-secret systemd unit
  ansible.builtin.template:
    src: novnc-rotate-secret.service.j2
    dest: /etc/systemd/system/novnc-rotate-secret.service
    mode: '0644'
  notify: Reload systemd

- name: Install novnc-set-base-url script
  ansible.builtin.copy:
    src: novnc-set-base-url
    dest: /usr/local/bin/novnc-set-base-url
    owner: root
    group: root
    mode: '0755'

- name: Install novnc-configure-userdata script
  ansible.builtin.copy:
    src: novnc-configure-userdata
    dest: /usr/local/bin/novnc-configure-userdata
    owner: root
    group: root
    mode: '0755'

- name: Install novnc-set-base-url systemd unit
  ansible.builtin.template:
    src: novnc-set-base-url.service.j2
    dest: /etc/systemd/system/novnc-set-base-url.service
    mode: '0644'
  notify: Reload systemd

- name: Install novnc-configure-userdata systemd unit
  ansible.builtin.template:
    src: novnc-configure-userdata.service.j2
    dest: /etc/systemd/system/novnc-configure-userdata.service
    mode: '0644'
  notify: Reload systemd

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Enable and start novnc-auth
  ansible.builtin.systemd:
    name: novnc-auth.service
    enabled: true
    state: started

- name: Enable novnc-rotate-secret for first-boot execution
  ansible.builtin.systemd:
    name: novnc-rotate-secret.service
    enabled: true

- name: Enable novnc-set-base-url to run on every boot
  ansible.builtin.systemd:
    name: novnc-set-base-url.service
    enabled: true

- name: Enable novnc-configure-userdata for first-boot execution
  ansible.builtin.systemd:
    name: novnc-configure-userdata.service
    enabled: true
