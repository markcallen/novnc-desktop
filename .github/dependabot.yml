version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      testing:
        patterns:
          - '@playwright/test'
          - 'playwright'
      typescript:
        patterns:
          - 'typescript'
          - '@types/*'
      dev-tooling:
        dependency-type: development
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'prettier'
          - 'globals'
          - 'typescript-eslint'
          - 'husky'
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: ansible
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /smoke/ec2
    schedule:
      interval: weekly
    groups:
      terraform-providers:
        patterns:
          - '*'
